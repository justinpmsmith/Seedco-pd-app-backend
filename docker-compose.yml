version: '3.5'

networks:
  seedco-network:
    name: seedco_default

volumes:
  postgres_data:
    name: misc_postgres_data
  pgadmin-data:
  media_data:

services:

  seedco-media:
    image: nginx:alpine
    container_name: seedco-media
    networks:
      - seedco-network
    ports:
      - "8765:80"
    volumes:
      - media_data:/usr/share/nginx/html/uploads
      - ./infra/nginx/conf.d/media.conf:/etc/nginx/conf.d/default.conf:ro

  seedco-pd-db:
    container_name: pd-db
    hostname: pd-db
    image: postgres:14-alpine
    restart: unless-stopped
    networks:
      - seedco-network
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./misc/scripts/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    environment:
      - POSTGRES_PASSWORD=tomatoes123
      - POSTGRES_USER=toolbox_admin
      - POSTGRES_DB=seedco_pd

  seedco-flask:
    container_name: seedco-flask
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - seedco-network
    ports:
      - "5000:5000"
    volumes:
      - media_data:/uploads
    env_file:
      - .env
    depends_on:
      - seedco-pd-db
